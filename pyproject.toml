[project]
name = "tenancy-information-assistant"
version = "0.1.0"
description = "LexTec challenge prototype: tenancy information assistant for social workers (canton Zurich)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-multipart>=0.0.9",
    "httpx>=0.27",
    "pydantic>=2.8",
    "pdfplumber>=0.11",
    "pillow>=10",
]

[tool.vercel]
entrypoint = "app.server:app"
